<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tree Ring Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            cursor: grab; /* Change cursor to indicate it's draggable */
        }
        canvas {
            display: block;
            /* The border has been removed */
        }
    </style>
</head>
<body>
    <canvas></canvas>
    <script>
        // ---  PARAMETERS TO CONFIGURE THE VISUALIZATION ---
        let CFG = {
            b: '#000000', // Background color set to black
            f: '#ffffff', // Foreground color set to white
            p: 400,       // Number of points (detail level)
            y: 30,        // Number of years (rings)
            r: 3.5,       // Ring initial space
            g: .53,       // Ring space yearly growth
            s: .21,       // Ring space randomness
            i: .09,       // Ring irregularity
            n: 3,         // Smoothing level
            k: .4,       // Tree skewness
            t: 40,        // Bark thickness
            c: .3,        // Bark skewness
            a: 6,         // Bark cracks
            v: .2,        // Bark crack curvature
            h: .5,        // Gap chance (not currently used in logic)
        };


        // --- SCRIPT ---
        let canvas, ctx;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let panOffset = { x: 0, y: 0 };
        let animationFrameId;

        // We will store the generated tree data here to redraw it quickly
        let drawingData = [];

        addEventListener('load', () => {
            canvas = document.getElementsByTagName('canvas')[0];
            ctx = canvas.getContext('2d');
            
            setupCanvas();
            generateTreeData(); // Generate the tree data first
            animateDrawing();   // Animate the drawing of the data

            // Add event listeners for dragging
            canvas.addEventListener('mousedown', onDragStart);
            canvas.addEventListener('mouseup', onDragEnd);
            canvas.addEventListener('mouseleave', onDragEnd);
            canvas.addEventListener('mousemove', onDragMove);
            window.addEventListener('resize', () => {
                setupCanvas();
                redrawCompletedTree(); // Redraw instantly on resize
            });
        });

        function setupCanvas() {
            // Make canvas fill the entire window
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.querySelector('body').style.backgroundColor = CFG.b;
        }

        // 1. Generate all the line and shape data without drawing it
        function generateTreeData() {
            drawingData = []; // Clear previous data
            let maxGrowDirection = Math.random() * Math.PI * 2;
            const points = Array(CFG.p).fill().map((_, i) => {
                const angle = i * Math.PI * 2 / CFG.p;
                return {
                    x: 0, y: 0, // Start points at the center (0,0)
                    d: angle,
                    k: (1 + CFG.k * (1 - angleDistance(angle, maxGrowDirection) / Math.PI)**2),
                    c: Math.random() < CFG.a / CFG.p,
                    i: CFG.i
                };
            });

            // Generate year rings data
            for (let y = 0; y <= CFG.y; y++) {
                // Calculation logic is the same as before
                const yearEffect = (CFG.r + CFG.g * y) * (1 + (2 * Math.random() - 1) * CFG.s);
                for (let p = 0; p < CFG.p; p++) points[p].s = yearEffect * (1 + (2 * Math.random() - 1) * points[p].i);
                for (let p = 0; p < CFG.p; p++) {
                    const neighbors = Array(2 * CFG.n + 1).fill().map((_, i) => points[(p + i - CFG.n + CFG.p) % CFG.p]);
                    points[p].ns = neighbors.reduce((sum, n, i) => sum + n.s * (1 - .5 * Math.abs(i - CFG.n) / CFG.n), 0) / (CFG.n * 1.5 + .5);
                }
                for (let p = 0; p < CFG.p; p++) points[p].s = points[p].ns;
                for (let p = 0; p < CFG.p; p++) {
                    points[p].x += Math.cos(points[p].d) * points[p].s * points[p].k;
                    points[p].y += Math.sin(points[p].d) * points[p].s * points[p].k;
                }
                // Store the calculated points for this ring
                drawingData.push({ type: 'ring', year: y, points: JSON.parse(JSON.stringify(points)) });
            }

            // Generate bark layers data
            maxGrowDirection = Math.random() * Math.PI * 2;
            for (let p = 0; p < CFG.p; p++) {
                points[p].k = (1 - CFG.c * (1 - angleDistance(points[p].d, maxGrowDirection) / Math.PI));
            }
            for (let c = 0; c < CFG.t * 2; c++) {
                for (let p = 0; p < CFG.p; p++) {
                    const s = Math.random();
                    points[p].x += s * Math.cos(points[p].d) * points[p].k;
                    points[p].y += s * Math.sin(points[p].d) * points[p].k;
                }
                drawingData.push({ type: 'bark', points: JSON.parse(JSON.stringify(points)) });
            }

            // Generate bark cracks data
            for (let p = 0; p < CFG.p; p++) {
                if (!points[p].c) continue;
                let bark = { x: points[p].x, y: points[p].y, d: points[p].d + Math.PI, w: 5 + Math.random() * 3, s: Math.max(.02, Math.random() / 5) };
                bark.x += Math.cos(bark.d) * bark.w;
                bark.y += Math.sin(bark.d) * bark.w;
                const trail = [];
                while (bark.w > 0) {
                    bark.x += Math.cos(bark.d);
                    bark.y += Math.sin(bark.d);
                    bark.d += CFG.v * (2 * Math.random() - 1) * Math.PI / 16;
                    bark.w -= 2 * bark.s * Math.random();
                    trail.push({x: bark.x, y: bark.y, w: bark.w});
                }
                drawingData.push({ type: 'crack', trail: trail });
            }
        }
        
        // 2. Animate the drawing of the pre-generated data
        function animateDrawing() {
            let step = 0;
            cancelAnimationFrame(animationFrameId);

            function drawStep() {
                if (step >= drawingData.length) return; // Animation finished
                drawSingleItem(drawingData[step]);
                step++;
                animationFrameId = requestAnimationFrame(drawStep);
            }
            drawStep();
        }

        // 3. Redraw the entire completed tree instantly (used for dragging)
        function redrawCompletedTree() {
            ctx.fillStyle = CFG.b;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Save context, translate, then draw everything
            ctx.save();
            ctx.translate(canvas.width / 2 + panOffset.x, canvas.height / 2 + panOffset.y);
            drawingData.forEach(item => drawSingleItem(item, false)); // Draw without animation gaps
            ctx.restore();
        }

        // Helper function to draw one item from our data array
        function drawSingleItem(item, isAnimated = true) {
            ctx.save();
            // If not animated, we need to apply the global translation
            if (!isAnimated) {
                // The global translate is already handled by redrawCompletedTree
            } else {
                 ctx.translate(canvas.width / 2 + panOffset.x, canvas.height / 2 + panOffset.y);
            }

            if (item.type === 'ring') {
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = CFG.f;
                let disabled = false;
                for (let p = 0; p < item.points.length; p++) {
                    const point = item.points[p];
                    const nextPoint = item.points[(p + 1) % item.points.length];
                    if (item.year < CFG.y - 1 && (Math.random() > .95 + .03 * item.year / CFG.y - (disabled ? .1 : 0))) disabled ^= true;
                    if (disabled) continue;
                    ctx.beginPath();
                    ctx.moveTo(Math.round(point.x), Math.round(point.y));
                    ctx.lineTo(Math.round(nextPoint.x), Math.round(nextPoint.y));
                    ctx.stroke();
                }
            } else if (item.type === 'bark') {
                ctx.strokeStyle = CFG.f;
                ctx.beginPath();
                ctx.moveTo(Math.round(item.points[0].x), Math.round(item.points[0].y));
                for (let p = 1; p < item.points.length; p++) {
                    ctx.lineTo(Math.round(item.points[p].x), Math.round(item.points[p].y));
                }
                ctx.closePath();
                ctx.stroke();
            } else if (item.type === 'crack') {
                ctx.fillStyle = CFG.f;
                for (let point of item.trail) {
                    ctx.beginPath();
                    ctx.arc(Math.round(point.x), Math.round(point.y), Math.round(point.w), 0, 2 * Math.PI);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        // --- DRAG HANDLERS ---
        function onDragStart(event) {
            cancelAnimationFrame(animationFrameId); // Stop animation when dragging starts
            isDragging = true;
            document.body.style.cursor = 'grabbing';
            dragStart.x = event.clientX - panOffset.x;
            dragStart.y = event.clientY - panOffset.y;
        }

        function onDragEnd() {
            isDragging = false;
            document.body.style.cursor = 'grab';
        }

        function onDragMove(event) {
            if (!isDragging) return;
            panOffset.x = event.clientX - dragStart.x;
            panOffset.y = event.clientY - dragStart.y;
            redrawCompletedTree();
        }

        function angleDistance(a, b) {
            const d = Math.abs(a - b);
            return Math.min(d, Math.PI * 2 - d);
        }
    </script>
</body>
</html>
