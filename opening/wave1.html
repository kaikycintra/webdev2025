<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Stepped Waves</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "simplex-noise": "https://cdn.skypack.dev/simplex-noise"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { createNoise2D } from 'simplex-noise';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let width = window.innerWidth;
        let height = window.innerHeight;

        const camera = new THREE.OrthographicCamera(width / -2, width / 2, height / 2, height / -2, 1, 1000);
        camera.position.z = 10;

        // --- WAVE PARAMETERS ---
        const WAVE_CONFIG = {
            points: 400,        // Number of points in each line
            stepDistance: 6,    // How far each new wave is from the last
            frameInterval: 1,   // Frames to wait before creating a new wave (lower is faster)
            noiseAmount: 50,    // Amplitude of the noise
            noiseFrequency: 0.008, // Frequency of the noise
            hueShift: 0.005     // How much the color changes for each new wave
        };

        const noise2D = createNoise2D();
        let currentX, baseHue, frameCounter, isAnimating;

        // --- WAVE CLASS ---
        // This class now creates a single, static, noisy line and adds it to the scene.
        class Wave {
            constructor(x, color, noiseSeed) {
                const points = [];
                for (let i = 0; i <= WAVE_CONFIG.points; i++) {
                    const y = (i / WAVE_CONFIG.points) * height - height / 2;
                    const noise = noise2D(y * WAVE_CONFIG.noiseFrequency, noiseSeed) * WAVE_CONFIG.noiseAmount;
                    points.push(new THREE.Vector3(x + noise, y, 0));
                }
                
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                // Add transparency to allow colors to blend
                const material = new THREE.LineBasicMaterial({ 
                    color: color,
                    transparent: true,
                    opacity: 0.75
                });
                const line = new THREE.Line(geometry, material);
                scene.add(line);
            }
        }

        // --- ANIMATION LOGIC ---
        
        // This function resets the animation state
        function initializeAnimation() {
            currentX = width / -2;
            baseHue = Math.random(); // Start with a random color
            frameCounter = 0;
            isAnimating = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // This block runs the animation until the screen is full
            if (isAnimating) {
                frameCounter++;
                if (frameCounter > WAVE_CONFIG.frameInterval) {
                    frameCounter = 0;

                    const newColor = new THREE.Color().setHSL(baseHue, 0.9, 0.6);
                    // Use the currentX position to give each wave a unique noise pattern
                    new Wave(currentX, newColor, currentX * 0.05);

                    // Move the starting point for the next wave forward
                    currentX += WAVE_CONFIG.stepDistance;
                    baseHue = (baseHue + WAVE_CONFIG.hueShift) % 1.0;

                    // Stop creating waves when we've crossed the screen
                    if (currentX > width / 2 + WAVE_CONFIG.noiseAmount) {
                        isAnimating = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // --- START ---
        initializeAnimation();
        animate();

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;

            camera.left = width / -2;
            camera.right = width / 2;
            camera.top = height / 2;
            camera.bottom = height / -2;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            
            // Clear all existing waves from the scene
            while(scene.children.length > 0){ 
                scene.remove(scene.children[0]); 
            }
            // Restart the animation
            initializeAnimation();
        });
    </script>
</body>
</html>
